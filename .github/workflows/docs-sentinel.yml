name: Docs Sentinel

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

# A called workflow can only DOWNGRADE these — the caller must grant them.
permissions:
  contents: write
  pull-requests: write

jobs:
  docs-sentinel:
    uses: slingshot/docs-sentinel/.github/workflows/audit.yml@v1
    secrets:
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      SYNC_PR_TOKEN: ${{ secrets.SYNC_PR_TOKEN }}
    with:
      # Only the two root-level living docs. `docs/**` holds dated design specs and
      # `.changeset/**` is generated by @changesets/cli — neither may be auto-edited,
      # so neither is reachable by this pattern.
      allowlist-regex: '^(README|CLAUDE)\.md$'
      # denylist-regex default is '(^|/)CHANGELOG\.md$'; the allowlist above already
      # excludes it, so no override is needed.
